name: DevOps CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: Check published runtime dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
        working-directory: app
      - run: npm test
        working-directory: app
  deploy-test:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PROJECT_IMAGE: project05-demo:${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install ansible-core==2.20.1
      - name: Check Ansible syntax
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml --syntax-check
      - name: Validate Compose configuration
        run: docker compose --project-name project05-demo config --quiet
      - name: Build commit-tagged image
        run: docker build -t "$PROJECT_IMAGE" .
      - name: Deploy, verify container and redeploy unchanged
        run: python scripts/verify-deployment.py
      - name: Reject a failed candidate and verify rollback
        run: python scripts/verify-rollback.py
      - name: Collect container diagnostics
        if: failure()
        run: docker compose --project-name project05-demo logs --no-color
      - name: Remove demonstration containers
        if: always()
        run: docker compose --project-name project05-demo down --remove-orphans
