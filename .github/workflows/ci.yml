name: DevOps CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-node-app:
    name: Test Node.js Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Test application
        working-directory: app
        run: npm test

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test-node-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-cicd-app:${{ github.sha }} .

  validate-ansible:
    name: Validate Ansible Playbook
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Check Ansible playbook syntax
        run: ansible-playbook --syntax-check -i ansible/inventory.ini ansible/site.yml

      - name: Run Ansible playbook
        run: ansible-playbook -i ansible/inventory.ini ansible/site.yml
