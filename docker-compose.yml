services:
  app:
    image: ${PROJECT_IMAGE:?Set PROJECT_IMAGE to the image being tested}
    ports:
      - "127.0.0.1:13000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
